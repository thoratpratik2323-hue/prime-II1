<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PRIME AI — Autonomous Mobile Cockpit</title>
  <!-- Three.js 3D Holographic Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands for Touchless Gestures -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cyan: #00e5ff;
      --cyan-dim: #00b8d4;
      --amber: #ffab00;
      --green: #00e676;
      --red: #ff1744;
      --purple: #7c4dff;
      --bg: #020912;
      --surface: rgba(0, 229, 255, 0.04);
      --border: rgba(0, 229, 255, 0.15);
      --text: #e0f7fa;
      --text-dim: #546e7a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }
    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 40px 40px; }
    }

    /* Glow background */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      padding: 24px 20px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      width: 100%;
    }
    .header .logo {
      font-family: 'Orbitron', monospace;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: 700;
      letter-spacing: 5px;
      color: var(--cyan);
      text-transform: uppercase;
      opacity: 0.85;
    }
    .header .title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(20px, 6vw, 26px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      margin-top: 4px;
      text-shadow: 0 0 30px rgba(0,229,255,0.5);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 8px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── Orb Container ── */
    .orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      position: relative;
    }

    .orb {
      width: clamp(160px, 45vw, 220px);
      height: clamp(160px, 45vw, 220px);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .orb-core {
      width: 60%; height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), var(--cyan) 60%, rgba(0,184,212,0.8));
      box-shadow:
        0 0 30px var(--cyan),
        0 0 60px rgba(0,229,255,0.4),
        inset 0 0 20px rgba(255,255,255,0.5);
      animation: orbFloat 4s ease-in-out infinite;
    }

    .orb-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0,229,255,0.4);
      animation: ringRotate 15s linear infinite;
    }
    .orb-ring-2 {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      border: 1px dotted rgba(0,229,255,0.2);
      animation: ringRotate 25s linear infinite reverse;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Orb States */
    .orb.listening .orb-core {
      background: radial-gradient(circle at 35% 35%, #fff, var(--green) 60%, #00b0ff);
      box-shadow: 0 0 40px var(--green), 0 0 80px rgba(0,230,118,0.5);
      animation: orbListen 1s ease-in-out infinite alternate;
    }
    @keyframes orbListen {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .orb.thinking .orb-core {
      background: radial-gradient(circle at 35% 35%, #fff, var(--amber) 60%, #ff6d00);
      box-shadow: 0 0 40px var(--amber), 0 0 80px rgba(255,171,0,0.5);
      animation: orbThink 0.8s ease-in-out infinite alternate;
    }
    @keyframes orbThink {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    .orb.speaking .orb-core {
      background: radial-gradient(circle at 35% 35%, #fff, var(--purple) 60%, var(--cyan));
      box-shadow: 0 0 50px var(--purple), 0 0 100px rgba(124,77,255,0.6);
      animation: orbSpeak 0.4s ease-in-out infinite alternate;
    }
    @keyframes orbSpeak {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.12); }
    }

    /* State Label */
    .state-label {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--cyan);
      margin-top: 24px;
      text-transform: uppercase;
      min-height: 20px;
      text-shadow: 0 0 15px var(--cyan);
    }

    /* Audio Waveform */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 40px;
      margin-top: 12px;
    }
    .bar {
      width: 3px;
      height: 4px;
      border-radius: 2px;
      background: var(--cyan);
      transition: height 0.08s ease;
      opacity: 0.7;
    }

    /* Transcript Box */
    .transcript-box {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.5;
      color: #cfd8dc;
      max-height: 110px;
      overflow-y: auto;
      margin: 10px 0;
      text-align: left;
    }

    /* Input Bar */
    .input-bar {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-bottom: 12px;
    }
    .input-field {
      flex: 1;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--cyan);
    }
    .btn-send {
      background: var(--cyan);
      color: #020912;
      border: none;
      border-radius: 8px;
      padding: 0 16px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      cursor: pointer;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .btn-connect {
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      border: 1px solid var(--cyan);
      background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(0,184,212,0.05));
      color: var(--cyan);
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0,229,255,0.2);
    }
    .btn-connect:active {
      transform: scale(0.98);
    }
    .btn-connect.active {
      border-color: var(--red);
      color: var(--red);
      box-shadow: 0 0 20px rgba(255,23,68,0.3);
    }

    .footer {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">⚡ S.A.T.U.R.D.A.Y & PRIME CORE</div>
    <div class="title">MOBILE COCKPIT</div>
    <div class="status-badge">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">NEURAL LINK READY</span>
    </div>
  </div>

  <!-- Floating Touchless Gesture PIP HUD (MediaPipe) -->
  <div id="gesturePip" style="display: none; position: fixed; top: 16px; right: 16px; width: 140px; height: 105px; border-radius: 10px; border: 1.5px solid var(--cyan); background: rgba(2,9,18,0.92); overflow: hidden; z-index: 100; box-shadow: 0 0 25px rgba(0,229,255,0.45);">
    <video id="webcamVideo" playsinline autoplay muted style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
    <canvas id="gestureCanvas" style="position: absolute; top:0; left:0; width: 100%; height: 100%; transform: scaleX(-1);"></canvas>
    <div id="gestureBadge" style="position: absolute; bottom: 3px; left: 3px; right: 3px; font-size: 8px; font-family: 'Orbitron'; background: rgba(0,0,0,0.8); color: var(--cyan); text-align: center; border-radius: 4px; padding: 2px 0; letter-spacing: 1px;">🖐️ HAND TRACKING</div>
  </div>

  <!-- Orb -->
  <div class="orb-container">
    <div class="orb" id="orb" onclick="toggleVoiceInput()">
      <canvas id="threeOrbCanvas" style="position: absolute; inset: -25px; width: calc(100% + 50px); height: calc(100% + 50px); border-radius: 50%; pointer-events: none; z-index: 2;"></canvas>
      <div class="orb-ring"></div>
      <div class="orb-ring-2"></div>
      <div class="orb-core"></div>
    </div>
    <div class="state-label" id="stateLabel">TAP ORB TO SPEAK</div>

    <!-- Waveform -->
    <div class="waveform" id="waveform">
      <!-- 24 visualizer bars -->
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <!-- Transcript & Controls -->
  <div class="controls">
    <div class="transcript-box" id="transcriptBox">
      <span style="color: #00e5ff;">Prime:</span> "Welcome back, Pratik! Cockpit is listening. Speak into your mic or type a command below."
    </div>

    <!-- Neural Mesh Cross-Device Quick Bar -->
    <div style="display: flex; gap: 6px; width: 100%; margin-bottom: 8px; justify-content: center; flex-wrap: wrap;">
      <button id="btnGesture" onclick="toggleTouchlessGestures()" style="background: rgba(0,229,255,0.12); border: 1px solid var(--cyan); color: var(--cyan); padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">🖐️ GESTURES</button>
      <button onclick="triggerRemoteAction('phone_battery')" style="background: rgba(0,230,118,0.12); border: 1px solid rgba(0,230,118,0.3); color: var(--green); padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">🔋 PHONE</button>
      <button onclick="syncClipboardToPC()" style="background: rgba(0,229,255,0.08); border: 1px solid var(--border); color: var(--cyan); padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">📋 PUSH CLIP</button>
      <button onclick="pullClipboardFromPC()" style="background: rgba(0,229,255,0.08); border: 1px solid var(--border); color: var(--cyan); padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">📥 GET PC CLIP</button>
      <button onclick="triggerRemoteAction('lock_pc')" style="background: rgba(255,23,68,0.12); border: 1px solid rgba(255,23,68,0.3); color: #ff5252; padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">🔒 LOCK PC</button>
      <button onclick="triggerRemoteAction('play_pause')" style="background: rgba(255,171,0,0.12); border: 1px solid rgba(255,171,0,0.3); color: var(--amber); padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">⏯️ MEDIA</button>
      <button onclick="triggerRemoteAction('screenshot_preview')" style="background: rgba(124,77,255,0.12); border: 1px solid rgba(124,77,255,0.3); color: #b388ff; padding: 6px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Orbitron'; font-weight: 700;">📷 SCREEN</button>
    </div>

    <div class="input-bar">
      <input type="text" id="cmdInput" class="input-field" placeholder="Type command to execute on PC..." onkeydown="if(event.key==='Enter') sendTextCommand()" />
      <button class="btn-send" onclick="sendTextCommand()">RUN</button>
    </div>

    <button class="btn-connect" id="btnConnect" onclick="toggleVoiceInput()">🎙️ START VOICE LINK</button>
    <div class="footer">PRIME AI · CROSS-DEVICE NEURAL MESH · PRATIK THORAT</div>
  </div>
</div>

<script>
  let isListening = false;
  let recognition = null;
  const orb = document.getElementById('orb');
  const stateLabel = document.getElementById('stateLabel');
  const btnConnect = document.getElementById('btnConnect');
  const transcriptBox = document.getElementById('transcriptBox');
  const bars = document.querySelectorAll('.bar');

  // Check Web Speech Recognition in browser
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function setVisualState(state, text) {
    orb.className = 'orb ' + state;
    stateLabel.textContent = text;
  }

  function appendLog(sender, message, isError = false) {
    const color = isError ? '#ff1744' : (sender === 'You' ? '#00e676' : '#00e5ff');
    const p = document.createElement('div');
    p.style.marginBottom = '6px';
    p.innerHTML = `<span style="color: ${color}; font-weight: bold;">${sender}:</span> ${message}`;
    transcriptBox.appendChild(p);
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
  }

  function simulateWaveform(active) {
    if (!active) {
      bars.forEach(b => b.style.height = '4px');
      return;
    }
    bars.forEach(b => {
      const h = Math.floor(Math.random() * 32) + 6;
      b.style.height = h + 'px';
    });
  }

  let waveInterval = null;
  function startWave() {
    if (!waveInterval) waveInterval = setInterval(() => simulateWaveform(true), 80);
  }
  function stopWave() {
    if (waveInterval) { clearInterval(waveInterval); waveInterval = null; }
    simulateWaveform(false);
  }

  // Text Command
  async function sendTextCommand() {
    const inp = document.getElementById('cmdInput');
    const txt = inp.value.trim();
    if (!txt) return;
    inp.value = '';
    appendLog('You', txt);
    await executeOnPC(txt);
  }

  // Voice Input via mobile browser
  function toggleVoiceInput() {
    if (isListening) {
      stopVoice();
    } else {
      startVoice();
    }
  }

  function startVoice() {
    if (!SpeechRecognition) {
      alert('Speech recognition is not supported on this browser. Please type commands below or use Chrome/Safari!');
      return;
    }
    try {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        setVisualState('listening', 'LISTENING...');
        btnConnect.textContent = '⏹️ STOP LISTENING';
        btnConnect.className = 'btn-connect active';
        startWave();
      };

      recognition.onresult = async (e) => {
        const spoken = e.results[0][0].transcript;
        appendLog('You', spoken);
        stopVoice();
        await executeOnPC(spoken);
      };

      recognition.onerror = (e) => {
        console.error('Speech error:', e);
        stopVoice();
      };

      recognition.onend = () => {
        if (isListening) stopVoice();
      };

      recognition.start();
    } catch (err) {
      console.error(err);
      stopVoice();
    }
  }

  function stopVoice() {
    isListening = false;
    stopWave();
    setVisualState('', 'TAP ORB TO SPEAK');
    btnConnect.textContent = '🎙️ START VOICE LINK';
    btnConnect.className = 'btn-connect';
    if (recognition) {
      try { recognition.stop(); } catch(e) {}
      recognition = null;
    }
  }

  // Send command to Prime PC Server
  async function executeOnPC(commandText) {
    setVisualState('thinking', 'PROCESSING ON PC...');
    startWave();
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: commandText })
      });
      const data = await res.json();
      stopWave();

      if (data.ok) {
        appendLog('Prime', data.reply);
        speakResponse(data.reply);
      } else {
        appendLog('Prime Error', data.error || 'Execution failed', true);
        setVisualState('', 'TAP ORB TO SPEAK');
      }
    } catch (err) {
      stopWave();
      appendLog('Network Error', 'Could not connect to PC server: ' + err.message, true);
      setVisualState('', 'TAP ORB TO SPEAK');
    }
  }

  // Voice speech synthesis on phone
  function speakResponse(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      setVisualState('speaking', 'PRIME SPEAKING...');
      startWave();
      const clean = text.replace(/[*_#`]/g, '');
      const utt = new SpeechSynthesisUtterance(clean);
      utt.rate = 1.05;
      utt.pitch = 0.95;
      utt.onend = () => {
        stopWave();
        setVisualState('', 'TAP ORB TO SPEAK');
      };
      utt.onerror = () => {
        stopWave();
        setVisualState('', 'TAP ORB TO SPEAK');
      };
      window.speechSynthesis.speak(utt);
    } else {
      setVisualState('', 'TAP ORB TO SPEAK');
    }
  }
  // ── Neural Mesh Cross-Device Sync ──
  async function syncClipboardToPC() {
    try {
      let text = '';
      if (navigator.clipboard && navigator.clipboard.readText) {
        text = await navigator.clipboard.readText();
      }
      if (!text) {
        text = prompt('Enter text to push to PC clipboard:');
      }
      if (!text) return;
      const res = await fetch('/api/mesh/clipboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (data.ok) {
        appendLog('Mesh Clipboard', 'Pushed ' + text.length + ' chars to PC clipboard.');
      } else {
        alert('Could not push to PC clipboard: ' + (data.error || 'unknown'));
      }
    } catch (e) {
      alert('Clipboard sync error: ' + e.message);
    }
  }

  async function pullClipboardFromPC() {
    try {
      const res = await fetch('/api/mesh/clipboard');
      const data = await res.json();
      if (data.ok && data.text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(data.text);
        }
        appendLog('Mesh Clipboard', 'Copied from PC: "' + data.text.substring(0, 80) + (data.text.length > 80 ? '...' : '') + '"');
      } else {
        appendLog('Mesh Clipboard', 'PC clipboard is empty.');
      }
    } catch (e) {
      appendLog('Mesh Error', 'Failed to pull PC clipboard: ' + e.message, true);
    }
  }

  async function triggerRemoteAction(action) {
    try {
      const res = await fetch('/api/mesh/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
      const data = await res.json();
      if (data.ok) {
        if (action === 'screenshot_preview' && data.image_b64) {
          const img = document.createElement('img');
          img.src = data.image_b64;
          img.style.maxWidth = '100%';
          img.style.borderRadius = '8px';
          img.style.marginTop = '6px';
          transcriptBox.appendChild(img);
          transcriptBox.scrollTop = transcriptBox.scrollHeight;
        } else {
          appendLog('Mesh Action', data.result || 'Executed ' + action);
        }
      } else {
        appendLog('Mesh Error', data.error || 'Action failed', true);
      }
    } catch (e) {
      appendLog('Mesh Error', 'Remote action error: ' + e.message, true);
    }
  }

  // ── Three.js Holographic Cockpit Orb ─────────────────────────────────────
  let threeScene, threeCamera, threeRenderer;
  let orbCoreMesh, orbWireMesh, orbRing1, orbRing2, particleCloud;
  let orbBaseColor = 0x00e5ff;
  let targetColor = 0x00e5ff;
  let orbRotSpeed = 0.008;
  let touchStartX = 0, touchStartY = 0, isDraggingOrb = false;

  function initThreeOrb() {
    const canvas = document.getElementById('threeOrbCanvas');
    if (!canvas || typeof THREE === 'undefined') return;

    const w = canvas.clientWidth || 240;
    const h = canvas.clientHeight || 240;

    threeScene = new THREE.Scene();
    threeCamera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
    threeCamera.position.z = 5.2;

    threeRenderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    threeRenderer.setSize(w, h);
    threeRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Inner Glowing Core
    const coreGeo = new THREE.SphereGeometry(1.0, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({
      color: orbBaseColor,
      wireframe: false,
      transparent: true,
      opacity: 0.22,
    });
    orbCoreMesh = new THREE.Mesh(coreGeo, coreMat);
    threeScene.add(orbCoreMesh);

    // Geodesic Holographic Wireframe
    const wireGeo = new THREE.IcosahedronGeometry(1.35, 2);
    const wireMat = new THREE.MeshBasicMaterial({
      color: orbBaseColor,
      wireframe: true,
      transparent: true,
      opacity: 0.55,
    });
    orbWireMesh = new THREE.Mesh(wireGeo, wireMat);
    threeScene.add(orbWireMesh);

    // Gimbal Ring 1
    const ring1Geo = new THREE.TorusGeometry(1.8, 0.02, 8, 48);
    const ring1Mat = new THREE.MeshBasicMaterial({ color: orbBaseColor, transparent: true, opacity: 0.4 });
    orbRing1 = new THREE.Mesh(ring1Geo, ring1Mat);
    threeScene.add(orbRing1);

    // Gimbal Ring 2
    const ring2Geo = new THREE.TorusGeometry(2.1, 0.015, 8, 48);
    const ring2Mat = new THREE.MeshBasicMaterial({ color: 0x00b8d4, transparent: true, opacity: 0.3 });
    orbRing2 = new THREE.Mesh(ring2Geo, ring2Mat);
    orbRing2.rotation.x = Math.PI / 3;
    threeScene.add(orbRing2);

    // Ambient Particle Nebula
    const partGeo = new THREE.BufferGeometry();
    const partCount = 120;
    const partPos = new Float32Array(partCount * 3);
    for (let i = 0; i < partCount * 3; i += 3) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 2.4 + Math.random() * 0.8;
      partPos[i] = r * Math.sin(phi) * Math.cos(theta);
      partPos[i+1] = r * Math.sin(phi) * Math.sin(theta);
      partPos[i+2] = r * Math.cos(phi);
    }
    partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
    const partMat = new THREE.PointsMaterial({ color: orbBaseColor, size: 0.05, transparent: true, opacity: 0.65 });
    particleCloud = new THREE.Points(partGeo, partMat);
    threeScene.add(particleCloud);

    // Touch / Pointer controls on 3D Orb
    const orbEl = document.getElementById('orb');
    if (orbEl) {
      orbEl.addEventListener('pointerdown', (e) => {
        isDraggingOrb = true;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
      });
      window.addEventListener('pointermove', (e) => {
        if (!isDraggingOrb) return;
        const dx = (e.clientX - touchStartX) * 0.008;
        const dy = (e.clientY - touchStartY) * 0.008;
        touchStartX = e.clientX;
        touchStartY = e.clientY;
        if (orbWireMesh) {
          orbWireMesh.rotation.y += dx;
          orbWireMesh.rotation.x += dy;
        }
      });
      window.addEventListener('pointerup', () => { isDraggingOrb = false; });
    }

    animateThree();
  }

  function updateThreeStateColor(state) {
    if (!orbCoreMesh || !orbWireMesh) return;
    let hex = 0x00e5ff;
    if (state === 'listening') hex = 0x00e676;
    else if (state === 'thinking') hex = 0xffab00;
    else if (state === 'speaking') hex = 0x7c4dff;
    targetColor = hex;
  }

  function animateThree() {
    requestAnimationFrame(animateThree);
    if (!threeRenderer || !threeScene || !threeCamera) return;

    // Smooth color interpolation
    if (orbCoreMesh && orbWireMesh) {
      orbCoreMesh.material.color.lerp(new THREE.Color(targetColor), 0.1);
      orbWireMesh.material.color.lerp(new THREE.Color(targetColor), 0.1);
      if (orbRing1) orbRing1.material.color.lerp(new THREE.Color(targetColor), 0.1);
    }

    // Rotations
    if (orbWireMesh) {
      orbWireMesh.rotation.y += orbRotSpeed;
      orbWireMesh.rotation.x += orbRotSpeed * 0.5;
    }
    if (orbRing1) orbRing1.rotation.z += orbRotSpeed * 1.4;
    if (orbRing2) {
      orbRing2.rotation.y += orbRotSpeed * 0.8;
      orbRing2.rotation.x += orbRotSpeed * 0.6;
    }
    if (particleCloud) {
      particleCloud.rotation.y -= orbRotSpeed * 0.4;
    }

    threeRenderer.render(threeScene, threeCamera);
  }

  // Hook Three.js color changes into state transitions
  const origSetVisualState = setVisualState;
  setVisualState = function(state, text) {
    origSetVisualState(state, text);
    updateThreeStateColor(state);
  };

  // ── MediaPipe Webcam Touchless Hand Gestures ─────────────────────────────
  let gesturesActive = false;
  let gestureCamera = null;
  let mpHands = null;
  let lastGestureTime = 0;
  let prevHandCenter = null;

  async function toggleTouchlessGestures() {
    const pip = document.getElementById('gesturePip');
    const btn = document.getElementById('btnGesture');
    const badge = document.getElementById('gestureBadge');

    if (gesturesActive) {
      // Deactivate
      gesturesActive = false;
      pip.style.display = 'none';
      btn.style.background = 'rgba(0,229,255,0.12)';
      btn.style.borderColor = 'var(--cyan)';
      btn.textContent = '🖐️ GESTURES';
      if (gestureCamera) {
        try { gestureCamera.stop(); } catch(e) {}
        gestureCamera = null;
      }
      appendLog('Gestures', 'Touchless hand gesture control disabled.');
      return;
    }

    // Activate
    try {
      appendLog('Gestures', 'Activating camera for touchless hand gestures...');
      pip.style.display = 'block';
      badge.textContent = 'INITIALIZING...';
      btn.textContent = '🖐️ GESTURES ON';
      btn.style.background = 'rgba(0,230,118,0.2)';
      btn.style.borderColor = 'var(--green)';

      const videoElement = document.getElementById('webcamVideo');
      const canvasElement = document.getElementById('gestureCanvas');
      const canvasCtx = canvasElement.getContext('2d');

      if (!mpHands && typeof Hands !== 'undefined') {
        mpHands = new Hands({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        mpHands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });

        mpHands.onResults((results) => {
          canvasCtx.save();
          canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

          if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            canvasElement.width = videoElement.videoWidth || 320;
            canvasElement.height = videoElement.videoHeight || 240;

            // Draw skeleton & landmarks
            canvasCtx.strokeStyle = '#00e5ff';
            canvasCtx.lineWidth = 2;
            canvasCtx.fillStyle = '#00e676';
            for (let pt of landmarks) {
              const x = pt.x * canvasElement.width;
              const y = pt.y * canvasElement.height;
              canvasCtx.beginPath();
              canvasCtx.arc(x, y, 3, 0, 2 * Math.PI);
              canvasCtx.fill();
            }

            processHandGestures(landmarks, badge);
          } else {
            badge.textContent = 'SEARCHING HAND...';
            prevHandCenter = null;
          }
          canvasCtx.restore();
        });
      }

      if (typeof Camera !== 'undefined') {
        gestureCamera = new Camera(videoElement, {
          onFrame: async () => {
            if (gesturesActive && mpHands) {
              await mpHands.send({ image: videoElement });
            }
          },
          width: 320,
          height: 240
        });
        await gestureCamera.start();
        gesturesActive = true;
        badge.textContent = 'GESTURES ACTIVE';
        appendLog('Gestures', 'Touchless hand gesture tracking online! Pinch to spin, Open Palm to Mute, Thumbs Up to Confirm.');
      } else {
        // Fallback standard getUserMedia
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' } });
        videoElement.srcObject = stream;
        videoElement.play();
        gesturesActive = true;
        badge.textContent = 'CAMERA ACTIVE';
        appendLog('Gestures', 'Webcam stream online. Hand gesture tracking active.');
      }
    } catch (err) {
      gesturesActive = false;
      pip.style.display = 'none';
      btn.textContent = '🖐️ GESTURES';
      btn.style.background = 'rgba(0,229,255,0.12)';
      btn.style.borderColor = 'var(--cyan)';
      appendLog('Gesture Error', 'Camera access failed: ' + err.message, true);
    }
  }

  function processHandGestures(landmarks, badgeEl) {
    const now = Date.now();
    const thumbTip = landmarks[4];
    const indexTip = landmarks[8];
    const middleTip = landmarks[12];
    const ringTip = landmarks[16];
    const pinkyTip = landmarks[20];

    const indexPip = landmarks[6];
    const middlePip = landmarks[10];
    const ringPip = landmarks[14];
    const pinkyPip = landmarks[18];

    // 1. PINCH DETECTION (Thumb tip + Index tip close)
    const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
    if (pinchDist < 0.08) {
      badgeEl.textContent = '👌 PINCH (SPIN 3D ORB)';
      badgeEl.style.color = '#ffab00';
      if (prevHandCenter) {
        const dx = (thumbTip.x - prevHandCenter.x) * 12.0;
        const dy = (thumbTip.y - prevHandCenter.y) * 12.0;
        if (orbWireMesh) {
          orbWireMesh.rotation.y += dx;
          orbWireMesh.rotation.x += dy;
        }
      }
      prevHandCenter = { x: thumbTip.x, y: thumbTip.y };
      return;
    } else {
      prevHandCenter = null;
    }

    // Cooldown check for discrete trigger gestures (1.8 seconds)
    if (now - lastGestureTime < 1800) return;

    // 2. OPEN PALM (All 4 fingers extended well above PIP joints)
    const isOpenPalm =
      indexTip.y < indexPip.y - 0.05 &&
      middleTip.y < middlePip.y - 0.05 &&
      ringTip.y < ringPip.y - 0.05 &&
      pinkyTip.y < pinkyPip.y - 0.05;

    if (isOpenPalm) {
      lastGestureTime = now;
      badgeEl.textContent = '🖐️ OPEN PALM [MUTING]';
      badgeEl.style.color = '#ff1744';
      appendLog('Gesture', '🖐️ Open Palm detected: Barge-in & Muting...');
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      stopVoice();
      fetch('/api/gesture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gesture: 'open_palm' })
      }).catch(e => console.warn(e));
      return;
    }

    // 3. THUMBS UP (Thumb pointing up, other 4 fingers curled down)
    const isThumbsUp =
      thumbTip.y < landmarks[2].y - 0.08 &&
      indexTip.y > indexPip.y &&
      middleTip.y > middlePip.y &&
      ringTip.y > ringPip.y &&
      pinkyTip.y > pinkyPip.y;

    if (isThumbsUp) {
      lastGestureTime = now;
      badgeEl.textContent = '👍 THUMBS UP [CONFIRM]';
      badgeEl.style.color = '#00e676';
      appendLog('Gesture', '👍 Thumbs Up detected: Confirming pending action/draft...');
      fetch('/api/gesture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gesture: 'thumbs_up' })
      }).catch(e => console.warn(e));
      return;
    }

    badgeEl.textContent = 'GESTURES READY';
    badgeEl.style.color = 'var(--cyan)';
  }

  // Initialize Three.js Orb on window load
  window.addEventListener('load', () => {
    initMeshEvents();
    initThreeOrb();
  });
</script>
</body>
</html>
